  hasScheduleDef:false,
  hasUniversityDef:false,
  hasPostGradDef:false,
  hasRecognisedInstitutionDef:false,
  hasRecognisedSchoolDef:false,
  hasCompassionateMode:false,
  hasPermanentCadreTransfer:false,
  cadreTransferFromPost:"",
  cadreTransferGroup:"C",
  cadreTransferMinYears:3,
  drafterName:"",
  drafterDesignation:"",
};

function computeRuleNums(d){
  const flags=modeFlags(d.appointmentMode);
  const multi=modeRatioKeys(d.appointmentMode).length>0;
  let n=4;const R={};
  if(multi)R.ratio=n++;
  if(d.hasDeptExam)R.deptExam=n++;
  if(flags.N||flags.D||flags.L)R.probation=n++;
  if(d.languageExam)R.language=n++;
  if(d.computerCert)R.computer=n++;
  if(d.smallFamily)R.smallFamily=n++;
  R.transfer=n++;
  if(d.otherRules)R.otherRules=n++;
  if(d.additionalProvisions)R.additional=n++;
  return R;
}

function F({label,hint,children}){return(<div className="mb-4">{label&&<label className={lc}>{label}</label>}{hint&&<p className="text-xs text-gray-400 mb-1">{hint}</p>}{children}</div>);}
function Sel({label,hint,value,onChange,options,placeholder}){return(<F label={label} hint={hint}><select className={ic} value={value} onChange={e=>onChange(e.target.value)}><option value="">{placeholder||"— Select —"}</option>{options.map((o,i)=><option key={i} value={typeof o==="string"?o:o.value}>{typeof o==="string"?o:o.label}</option>)}</select></F>);}
function SearchInput({label,hint,value,onChange,listId}){return(<F label={label} hint={hint}><input className={ic} list={listId} placeholder="Type to search…" value={value} onChange={e=>onChange(e.target.value)}/><datalist id={listId}>{POST_LIST.map((p,i)=><option key={i} value={p}/>)}</datalist></F>);}
function Slide({label,hint,value,min,max,step=1,onChange,unit="yrs"}){return(<F label={label} hint={hint}><div className="flex items-center gap-3"><span className="text-xs text-gray-400 w-8 shrink-0">{min}{unit}</span><input type="range" min={min} max={max} step={step} value={value} onChange={e=>onChange(Number(e.target.value))} className="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600"/><span className="text-sm font-bold text-blue-700 w-16 text-right shrink-0">{value} {unit}</span></div></F>);}
function Toggle({label,checked,onChange,hint}){return(<div className="flex items-center justify-between py-2 border-b border-gray-100 last:border-0"><div><div className="text-sm font-medium text-gray-700">{label}</div>{hint&&<div className="text-xs text-gray-400">{hint}</div>}</div><button onClick={()=>onChange(!checked)} className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${checked?"bg-blue-600":"bg-gray-300"}`}><span className={`inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform ${checked?"translate-x-6":"translate-x-1"}`}/></button></div>);}
function Badge({color,children}){const m={blue:"bg-blue-100 text-blue-700",green:"bg-green-100 text-green-700",orange:"bg-orange-100 text-orange-700",purple:"bg-purple-100 text-purple-700",pink:"bg-pink-100 text-pink-700",gray:"bg-gray-100 text-gray-700",red:"bg-red-100 text-red-700"};return <span className={`${m[color]||m.blue} text-xs font-bold px-2 py-0.5 rounded`}>{children}</span>;}

// ── QUALIFICATION BUILDER ─────────────────────────────────────────────────────
function QualificationBuilder({quals,connectors,onChange}){
  const QTYPES=[["degree","Degree"],["diploma","Diploma"],["iti","ITI Certificate"],["any","Custom"]];
  const addQual=()=>onChange({quals:[...quals,{type:"degree",subjects:[{value:"",customText:""}],subjectConnectors:[],itiField:"",includeEquivalence:false}],connectors:[...connectors,"or"]});
  const removeQual=(i)=>{if(quals.length<=1)return;const ci=i===0?0:i-1;onChange({quals:quals.filter((_,idx)=>idx!==i),connectors:connectors.filter((_,idx)=>idx!==ci)});};
  const updQual=(i,k,v)=>{const q=[...quals];q[i]={...q[i],[k]:v};onChange({quals:q,connectors});};
  const toggleOuterConn=(i)=>{const c=[...connectors];c[i]=c[i]==="or"?"and":"or";onChange({quals,connectors:c});};
  const getSubjects=(q)=>q.subjects&&q.subjects.length>0?q.subjects:[{value:q.subject||"",customText:""}];
  const getSubjConns=(q)=>q.subjectConnectors||[];
  const addSubject=(qi)=>{const q=[...quals];const subs=getSubjects(q[qi]);const conns=getSubjConns(q[qi]);q[qi]={...q[qi],subjects:[...subs,{value:"",customText:""}],subjectConnectors:[...conns,"or"]};onChange({quals:q,connectors});};
  const removeSubject=(qi,si)=>{const q=[...quals];const subs=getSubjects(q[qi]).filter((_,idx)=>idx!==si);const conns=getSubjConns(q[qi]).filter((_,idx)=>idx!==(si===0?0:si-1));q[qi]={...q[qi],subjects:subs,subjectConnectors:conns};onChange({quals:q,connectors});};
  const updSubject=(qi,si,k,v)=>{const q=[...quals];const subs=[...getSubjects(q[qi])];subs[si]={...subs[si],[k]:v};q[qi]={...q[qi],subjects:subs};onChange({quals:q,connectors});};
  const toggleSubjConn=(qi,si)=>{const q=[...quals];const conns=[...getSubjConns(q[qi])];conns[si]=conns[si]==="or"?"and":"or";q[qi]={...q[qi],subjectConnectors:conns};onChange({quals:q,connectors});};
  return(<div>
    {quals.map((q,i)=>{
      const subs=getSubjects(q);const subjConns=getSubjConns(q);
      return(<div key={i}>
        <div className="p-3 bg-gray-50 rounded-lg border border-gray-200 mb-1">
          <div className="flex flex-wrap gap-1 mb-3 items-center">
            {QTYPES.map(([v,l])=>(<button key={v} onClick={()=>updQual(i,"type",v)} className={`px-2 py-1 rounded text-xs font-medium border transition ${q.type===v?"bg-green-600 text-white border-green-600":"bg-white text-gray-600 border-gray-300 hover:border-green-400"}`}>{l}</button>))}
            {quals.length>1&&<button onClick={()=>removeQual(i)} className="ml-auto text-red-400 hover:text-red-600 font-bold text-lg leading-none px-1">×</button>}
          </div>
          {(q.type==="degree"||q.type==="diploma")&&(<>
            <p className="text-xs text-gray-500 mb-2">Field(s) of Study — use the <strong>OR / AND</strong> toggle to connect multiple fields.</p>
            {subs.map((subj,si)=>(<div key={si} className="mb-1">
              <div className="flex gap-2 items-center">
                <select className={ic+" flex-1"} value={subj.value||""} onChange={e=>updSubject(i,si,"value",e.target.value)}>
                  <option value="">— Select field of study —</option>
                  {QUAL_SUBJECTS.map((s,j)=><option key={j} value={s}>{s}</option>)}
                  <option value="__other__">▸ Other (specify free text)…</option>
                </select>
                {subs.length>1&&<button onClick={()=>removeSubject(i,si)} className="text-red-400 hover:text-red-600 font-bold text-lg leading-none px-1 shrink-0">×</button>}
              </div>
              {subj.value==="__other__"&&<input className={ic+" mt-1"} placeholder="Type the field of study here…" value={subj.customText||""} onChange={e=>updSubject(i,si,"customText",e.target.value)}/>}
              {si<subs.length-1&&(<div className="flex justify-center my-2"><button onClick={()=>toggleSubjConn(i,si)} className={`px-5 py-1 rounded-full text-xs font-bold border-2 transition shadow-sm ${subjConns[si]==="or"?"bg-blue-600 text-white border-blue-600":"bg-orange-500 text-white border-orange-500"}`}>{subjConns[si]==="or"?"OR — either field acceptable":"AND — both fields required"}</button></div>)}
            </div>))}
            <button onClick={()=>addSubject(i)} className="mt-2 text-xs text-blue-600 hover:underline font-medium">+ Add another field of study</button>
            <div className="flex items-center gap-2 mt-3">
              <input type="checkbox" id={`eq${i}`} checked={!!q.includeEquivalence} onChange={e=>updQual(i,"includeEquivalence",e.target.checked)} className="h-3.5 w-3.5"/>
              <label htmlFor={`eq${i}`} className="text-xs text-gray-500">Include equivalence clause <span className="text-gray-400">("or any other qualification declared by the Government to be equivalent thereto")</span></label>
            </div>
          </>)}
          {q.type==="iti"&&(<><input className={ic} placeholder="Specify ITI trade / field (e.g. Electrician, Fitter, Wireman, Carpenter, Welder)" value={q.itiField||""} onChange={e=>updQual(i,"itiField",e.target.value)}/><p className="text-xs text-gray-400 mt-1">Auto-framed as: ITI Certificate in [trade] from an Industrial Training Institute recognised by the Government.</p></>)}
          {q.type==="any"&&<textarea className={ic} rows={2} placeholder="Describe the qualification in full…" value={q.subject||""} onChange={e=>updQual(i,"subject",e.target.value)}/>}
        </div>
        {i<quals.length-1&&(<div className="flex justify-center my-2"><button onClick={()=>toggleOuterConn(i)} className={`px-5 py-1.5 rounded-full text-xs font-bold border-2 transition shadow-sm ${connectors[i]==="or"?"bg-blue-600 text-white border-blue-600":"bg-orange-500 text-white border-orange-500"}`}>{connectors[i]==="or"?"OR — either qualification is acceptable":"AND — both qualifications required"}</button></div>)}
      </div>);
    })}
    <button onClick={addQual} className="mt-2 text-xs text-green-600 hover:underline font-medium">+ Add another qualification option</button>
  </div>);
}

// ── STEP 4 ────────────────────────────────────────────────────────────────────
function Step4({d,set}){
  const flags=modeFlags(d.appointmentMode);
  const ratioKeys=modeRatioKeys(d.appointmentMode);
  const ratioSum=ratioKeys.reduce((s,k)=>s+Number(d[k]||0),0);
  const ratioOk=ratioKeys.length===0||ratioSum===100;
  const toggleAgeCat=(opt)=>{const exists=d.ageCategories.find(c=>c.label===opt.label);if(exists)set("ageCategories",d.ageCategories.filter(c=>c.label!==opt.label));else set("ageCategories",[...d.ageCategories,{label:opt.label,max:opt.def}]);};

// ── PREVIEW helpers ───────────────────────────────────────────────────────────
function fmtDate(v){if(!v)return"__________";return new Date(v).toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"});}

function renderSubjectPhrase(q){
  const subs=q.subjects&&q.subjects.length>0?q.subjects:[{value:q.subject||"",customText:""}];
  const conns=q.subjectConnectors||[];
  const parts=subs.map(s=>{if(!s.value)return"[SUBJECT]";return s.value==="__other__"?(s.customText||"[SUBJECT]"):s.value;});
  return parts.reduce((acc,p,i)=>i===0?p:`${acc} ${(conns[i-1]||"or").toUpperCase()} ${p}`,"");
}

function buildQualPhrase(d){
  const quals=d.eduQuals;
  if(!quals||quals.length===0)return"[QUALIFICATION]";
  const outerConns=d.eduQualConnectors||[];
  const parts=quals.map(q=>{
    if(q.type==="iti")return`ITI Certificate in ${q.itiField||"[TRADE]"} from an Industrial Training Institute recognised by the Government`;
    if(q.type==="any")return q.subject||"[QUALIFICATION]";
    const typeLabel=q.type==="diploma"?"diploma":"bachelor's degree";
    const subjPhrase=renderSubjectPhrase(q);
    const equiv=q.includeEquivalence?", or any other qualification declared by the Government to be equivalent thereto":"";
    return`a ${typeLabel} in ${subjPhrase} from a statutory university${equiv}`;
  });
  return parts.reduce((acc,p,i)=>i===0?p:`${acc} ${(outerConns[i-1]||"or").toUpperCase()} ${p}`,"");
}

// ── NEW: Build dynamic definitions array for Rule 2 ───────────────────────────
function buildDefsArray(d){
  const mp=d.posts[0]||{name:"[POST NAME]",group:"A",gazetted:true,recruitingBody:"commission"};
  const postLabel=`"${mp.name||"[POST NAME]"}", Group-${mp.group} (${mp.gazetted?"Gazetted":"Non-Gazetted"})`;
  const flags=modeFlags(d.appointmentMode);
  const showCommission=(mp.group==="A")||(mp.group==="B"&&mp.gazetted)||(mp.recruitingBody==="commission");
  const showSelComm=mp.recruitingBody==="selection_committee"||mp.group==="D";
  const hasDiplomaQual=(d.eduQuals||[]).some(q=>q.type==="diploma");
  const hasSSCQual=(d.eduQuals||[]).some(q=>(q.subjects||[]).some(s=>s.value==="Secondary School Certificate (SSC) Examination"));

  const defs=[];
  defs.push({key:"govt",term:'"Government"',text:"means the Government of Maharashtra"});
  if(d.deptName)defs.push({key:"dept",term:`"${d.deptName}"`,text:`means the Department specified in the First Schedule appended to the Maharashtra Government Rules of Business made under Article 166 of the Constitution of India`});
  if(d.establishment)defs.push({key:"estab",term:`"${d.establishment}"`,text:`means ${d.establishment} under the administrative control of ${d.deptName||"[Department]"}, Government of Maharashtra`});
  if(showCommission)defs.push({key:"comm",term:'"Commission"',text:"means the Maharashtra Public Service Commission"});
  if(showSelComm)defs.push({key:"selcomm",term:'"Selection Committee"',text:`means the Committee constituted from time to time by the Government for the purpose of selection of candidates for direct recruitment to the post of ${postLabel} in the Government Service`});
  if(mp.group==="D")defs.push({key:"groupd",term:'"Post in Group-D"',text:"means post falling in Group-D"});
  if(d.defDegreeSubject)defs.push({key:"degree",term:'"Degree"',text:`means a degree in ${d.defDegreeSubject} of a statutory University or any other qualification declared by the Government to be equivalent thereto`});
  if(hasDiplomaQual)defs.push({key:"diploma",term:'"Diploma"',text:"means a diploma of any discipline of a statutory University or any other qualification declared by the Government to be equivalent thereto"});
  if(d.hasUniversityDef)defs.push({key:"univ",term:'"University"',text:"means statutory University recognised by University Grant Commission (U.G.C.)"});
  if(d.hasPostGradDef)defs.push({key:"postgrad",term:'"Post graduation degree"',text:"means a Post Graduation degree of Statutory University or any other qualification declared by the government of India or the State Government to be equivalent thereto"});
  if(hasSSCQual)defs.push({key:"ssc",term:'"Secondary School Certificate Examination"',text:"means the Secondary School Certificate Examination conducted by a Divisional Board constituted under the Maharashtra Secondary and Higher Secondary Education Board Act, 1965 (Mah. XLI of 1965) and includes any other examination declared by Government to be equivalent thereto"});
  if(d.hasRecognisedInstitutionDef)defs.push({key:"recinst",term:'"Recognised Institution"',text:"means an Institution recognised by the Government"});
  if(d.hasRecognisedSchoolDef)defs.push({key:"recsch",term:'"Recognized school"',text:"means the Government recognized school"});
  if(d.defTechnicalQual)defs.push({key:"techqual",term:'"Technical Qualification"',text:`means ${d.defTechnicalQual}`});
  defs.push({key:"apptauth",term:'"Appointing Authority"',text:`means ${d.defAppointingAuth||"[APPOINTING AUTHORITY]"}, who is the competent authority to appoint a candidate to the post of ${postLabel}`});
  if(flags.L)defs.push({key:"lde",term:'"Limited Departmental Competitive Examination"',text:`means the competitive examination conducted by the Commission amongst the eligible candidates for promotion on the post of ${mp.name||"[POST NAME]"}`});
  if(d.hasScheduleDef)defs.push({key:"sched",term:'"Schedule"',text:"means the schedule annexed to the rules"});
  // UPDATED from PDF: "Eligibility for Promotion" replaces "Eligibility subject to Seniority"
  if(flags.P)defs.push({key:"eligpromo",term:'"Eligibility for Promotion"',text:"means eligibility for promotion in accordance with the terms and conditions prescribed through rules, Government Resolutions, or orders issued from time to time in this regard by the General Administration Department of the Government"});
  return defs;
}

// ── PREVIEW ───────────────────────────────────────────────────────────────────
function Preview({d}){
  const mp=d.posts[0]||{name:"[POST NAME]",group:"A",gazetted:true,feederPost:"[FEEDER POST]",feederYears:3,recruitingBody:"commission"};
  const postLabel=`"${mp.name||"[POST NAME]"}", Group-${mp.group} (${mp.gazetted?"Gazetted":"Non-Gazetted"})`;
  const dept=DEPT_DATA.find(x=>x.name===d.deptName);
  const addr=(dept&&dept.address)?dept.address:"";
  const rn=d.ruleName||`${mp.name||"[POST NAME]"}, Group-${mp.group} (${mp.gazetted?"Gazetted":"Non-Gazetted"}) in the ${d.establishment||"[OFFICE]"} (Recruitment) Rules`;
  const rb=mp.recruitingBody==="selection_committee"?"Selection Committee":"Commission";
  const flags=modeFlags(d.appointmentMode);
  const ratioKeys=modeRatioKeys(d.appointmentMode);
  const multi=ratioKeys.length>0;
  const hasNewModes=d.hasCompassionateMode||d.hasPermanentCadreTransfer;

  // Rule 3 sub-clause letter assignment
  let cl=97;
  const pL=flags.P?String.fromCharCode(cl++):null;
  const dL=flags.D?String.fromCharCode(cl++):null;
  const lL=flags.L?String.fromCharCode(cl++):null;
  const nL=flags.N?String.fromCharCode(cl++):null;
  const compassL=d.hasCompassionateMode?String.fromCharCode(cl++):null;
  const cadreL=d.hasPermanentCadreTransfer?String.fromCharCode(cl++):null;

  const R=computeRuleNums(d);
  const RLABELS={promotionRatio:"promotion",deputationRatio:"deputation",nominationRatio:"nomination",ldeRatio:"Limited Departmental Competitive Examination"};

  const supersessionText=d.rrType==="superseding"?` and in supersession of all the existing rules, orders or instruments issued in this behalf${d.existingNotifNo?` vide Notification No. ${d.existingNotifNo}${d.existingNotifDate?" dated "+fmtDate(d.existingNotifDate):""}`:""}, `:" ";
  const modeOpenMap={promotion:"regulating appointment by promotion to the post",deputation:"regulating appointment by deputation to the post",nomination:"regulating direct recruitment by nomination to the post",promotion_deputation:"regulating recruitment by promotion and deputation to the post",promotion_nomination:"regulating recruitment by promotion and direct recruitment (nomination) to the post",deputation_nomination:"regulating recruitment by deputation and direct recruitment (nomination) to the post",all:"regulating recruitment to the post",promotion_lde_nomination:"regulating recruitment to the post"};

  // Rule 3 tail: if new modes are added to a single-mode appointment, switch to "either,—"
  const baseRule3tail={promotion:"by promotion as follows,—",deputation:"by deputation as follows,—",nomination:"by direct recruitment (nomination) as follows,—",promotion_deputation:"either,—",promotion_nomination:"either,—",deputation_nomination:"either,—",all:"either,—",promotion_lde_nomination:"either,—"};
  const isSingleBaseTail=!baseRule3tail[d.appointmentMode]?.startsWith("either");
  const effectiveRule3Tail=hasNewModes&&isSingleBaseTail?"either,—":baseRule3tail[d.appointmentMode];

  const qualPhrase=buildQualPhrase(d);
  const tlevel=TRANSFER_LEVELS.find(t=>t.val===d.transferLevel)||TRANSFER_LEVELS[0];
  const defs=buildDefsArray(d);

  return(<div className="bg-white rounded-xl border border-gray-200 shadow-sm font-serif text-sm leading-relaxed">
    <div className="text-center py-6 px-8 border-b border-gray-200 bg-gray-50 rounded-t-xl">
      <div className="text-xs text-gray-500 mb-1">GOVERNMENT OF MAHARASHTRA</div>
      <div className="text-lg font-bold text-gray-900 uppercase tracking-wide">{d.deptName||"[DEPARTMENT NAME]"}</div>
      <div className="text-xs text-gray-500 mt-0.5">{d.establishment||"[OFFICE / ESTABLISHMENT]"}</div>
      <div className="text-xs text-gray-600 mt-1">{addr&&addr+", "}dated the __________.</div>
      <div className="mt-3 italic font-semibold text-gray-800">NOTIFICATION</div>
      <div className="mt-1 text-xs text-gray-400">Constitution of India</div>
    </div>
    <div className="px-8 py-6 space-y-4">
      <p><span className="font-bold">No. ____________.</span>—In exercise of the powers conferred by the proviso to article 309 of the Constitution of India{supersessionText}the Governor of Maharashtra is hereby pleased to make the following {d.rrType==="superseding"?"new ":""}rules {modeOpenMap[d.appointmentMode]} of {postLabel} in the <span className="font-semibold">{d.establishment||"[OFFICE NAME]"}</span>, namely:—</p>

      <div>
        <p className="font-bold">1. Short Title, Commencement and Application.—</p>
        <p className="ml-4 mt-1">(1) These rules may be called <span className="font-semibold">"{rn}, ____."</span></p>
        <p className="ml-4 mt-1">(2) These rules shall come into force on the date of their publication in the Government Gazette.</p>
      </div>

      {/* ── Rule 2: DYNAMIC definitions with auto-assigned letters ── */}
      <div>
        <p className="font-bold">2. Definitions.— In these rules unless the context requires otherwise,—</p>
        {defs.map((def,i)=>(
          <p key={def.key} className="ml-4 mt-1">
            <span className="italic">({String.fromCharCode(97+i)})</span> <span className="font-bold">{def.term}</span> {def.text};
          </p>
        ))}
      </div>

      {/* ── Rule 3: Mode of Appointment ── */}
      <div>
        <p className="font-bold">3. Mode of Appointment.— The mode of appointment to {postLabel} shall be {effectiveRule3Tail}</p>

        {flags.P===1&&<div className="ml-4 mt-2"><p><span className="italic">({pL})</span> <span className="font-bold">By Promotion</span> — By promotion of a suitable person on the basis of seniority subject to fitness from amongst the persons holding the post of <span className="font-semibold">{mp.feederPost||"[FEEDER POST]"}</span>, Group-{mp.group} having regular and continuous service on that post of not less than <span className="font-semibold">{mp.feederYears} years</span>{d.defDegreeSubject?` and possessing ${d.defDegreeSubject} or equivalent qualification`:""}{d.promotionHasDeptExam?` and either having passed the ${d.promotionDeptExamName||"[DEPARTMENTAL EXAMINATION]"} or having been exempted therefrom`:""}{ (flags.D||flags.L||flags.N||hasNewModes)?"; or":"."}</p></div>}

        {flags.N===1&&<div className="ml-4 mt-2">
          <p><span className="italic">({nL})</span> <span className="font-bold">By Nomination</span> — By nomination of candidates recommended by the <span className="font-semibold">{rb}</span> on the basis of result of Competitive Examination conducted therefor, who fulfils the following criteria, namely:—</p>
          <div className="ml-4 mt-2 space-y-3">
            <div>
              {/* UPDATED: Age limit syntax per PDF — number words, "as on last date of acceptance" */}
              <p className="font-bold">(I) Age Limit.—</p>
              <p className="ml-4">(i) Minimum Age Limit — Not less than {numWords(d.ageLowerLimit)} years as on the last date of acceptance of applications mentioned in the advertisement;</p>
              <p className="ml-4">(ii) Maximum Age Limit —</p>
              {d.ageCategories.map((cat,i)=>(<p key={i} className="ml-8">{"("+String.fromCharCode(65+i)+")"} <span className="font-semibold">{cat.label}:</span> Not more than {numWords(cat.max)} years as on the last date of acceptance of applications mentioned in the advertisement;</p>))}
            </div>
            {d.eduQualSubject&&<div><p className="font-bold">(II) Educational Qualification.—</p><p className="ml-4">A candidate shall possess {qualPhrase}.</p></div>}
            {d.hasPhysicalEligibility&&<div><p className="font-bold">(III) Physical Eligibility.—</p>{d.physicalHeight&&<p className="ml-4">Height: {d.physicalHeight}</p>}{d.physicalChest&&<p className="ml-4">Chest: {d.physicalChest}</p>}{d.physicalVision&&<p className="ml-4">Vision: {d.physicalVision}</p>}</div>}
            {d.hasTechnicalQualNomination&&d.defTechnicalQual&&<div><p className="font-bold">(IV) Technical Qualification.—</p><p className="ml-4">A candidate shall possess {d.defTechnicalQual}.</p></div>}
            {d.hasExperience&&<div><p className="font-bold">{d.hasTechnicalQualNomination?"(V)":"(IV)"} Experience.—</p><p className="ml-4">A candidate shall have a minimum of <span className="font-semibold">{d.experienceYears} years</span> of experience, gained after acquiring the minimum educational qualification mentioned in sub-rule (II) above{d.experienceDesc?`, in ${d.experienceDesc}`:""}.{d.experienceNote?` Explanation — ${d.experienceNote}.`:""}</p></div>}
          </div>
          {(flags.D||flags.L||hasNewModes)?<p className="ml-4 mt-1 italic">; or</p>:null}
        </div>}
        {flags.L===1&&<div className="ml-4 mt-2"><p><span className="italic">({lL})</span> <span className="font-bold">By Limited Departmental Examination</span> — The selection shall be made on the basis of Common Merit List prepared from the result of the Limited Departmental Competitive Examination conducted by <span className="font-semibold">{d.ldeExamBody}</span> from amongst the persons holding the post of <span className="font-semibold">{d.ldeEligiblePost||"[ELIGIBLE POST]"}</span> having not less than <span className="font-semibold">{d.ldeMinService} years</span> of regular and continuous service on that post{(flags.D||hasNewModes)?"; or":"."}</p></div>}
        {flags.D===1&&<div className="ml-4 mt-2"><p><span className="italic">({dL})</span> <span className="font-bold">By Deputation</span> — In the event of non-availability of suitable candidates through {[flags.P&&"promotion",flags.N&&"nomination",flags.L&&"Limited Departmental Examination"].filter(Boolean).join(", ")||"other modes"}, a suitable person shall be appointed by deputation from officers/employees{d.deputationSource?` of ${d.deputationSource}`:""} holding posts with equivalent pay scales.</p><p className="ml-4 mt-1">Provided that, the appointment by deputation shall be made in adherence to all the terms and conditions of the Deputation Policy of the General Administration Department from time to time. Further, the appointment by deputation shall not exceed <span className="font-semibold">fifteen per cent</span> of the total number of sanctioned posts. The period of such deputation shall ordinarily not exceed <span className="font-semibold">{d.deputationPeriod} years</span>.</p>{hasNewModes&&<p className="ml-4 mt-1 italic">; or</p>}</div>}
        {d.hasCompassionateMode&&compassL&&<div className="ml-4 mt-2"><p><span className="italic">({compassL})</span> <span className="font-bold">By Compassionate Appointment</span> — by appointment of a suitable person on compassionate ground, in accordance with the orders issued in this behalf by the Government, from time to time, who possesses the educational qualification{d.hasTechnicalQualNomination&&d.defTechnicalQual?" and technical qualification":""} as specified in clause ({nL||"b"}) above.</p>{d.hasPermanentCadreTransfer&&<p className="ml-4 mt-1 italic">; or</p>}</div>}
        {d.hasPermanentCadreTransfer&&cadreL&&<div className="ml-4 mt-2"><p><span className="italic">({cadreL})</span> <span className="font-bold">By Permanent Cadre Transfer</span> — by permanent cadre transfer of a suitable person from amongst the persons holding the post of <span className="font-semibold">{d.cadreTransferFromPost||"[FROM POST]"}</span>, Group-{d.cadreTransferGroup}, who prefer the post of <span className="font-semibold">{mp.name||"[THIS POST]"}</span>, having completed not less than <span className="font-semibold">{d.cadreTransferMinYears} years</span> of regular service on the post of {d.cadreTransferFromPost||"[FROM POST]"} and possessing qualifications mentioned in clause ({nL||"b"}) above, on the basis of seniority subject to fitness. The seniority of such persons on the post of {mp.name||"[THIS POST]"} shall be fixed from the date of appointment to the post of {mp.name||"[THIS POST]"}.</p></div>}
      </div>
      {multi&&R.ratio&&<div><p className="font-bold">{R.ratio}. Proportion of Appointment.—</p><p className="mt-1">The proportion of appointment to the post mentioned in Rule 3 by {ratioKeys.map(k=>RLABELS[k]).join(", ")} shall be <span className="font-semibold">{ratioKeys.map(k=>d[k]).join(":")}</span> respectively, for the total number of sanctioned posts.</p><p className="mt-1">Provided that, if suitable candidates for appointment by promotion are not available, the proportion of appointment by promotion and nomination may be relaxed for that particular recruitment year with the consent of the Appointing Authority, and the posts earmarked for promotion may be filled by nomination.</p></div>}
      {d.hasDeptExam&&R.deptExam&&<div><p className="font-bold">{R.deptExam}. Departmental Examination.—</p><p className="mt-1">The person appointed to the post mentioned in Rule 3 shall pass the <span className="font-semibold">{d.deptExamName||"[DEPARTMENTAL EXAMINATION]"}</span>{d.deptExamPurpose==="confirmation"?" within the probation period (including extended period). Failure to pass the said examination within the probation period shall render his/her services liable to be terminated.":" within the time limit prescribed by the Government from time to time. Failure to pass the said examination within the prescribed time limit shall render him/her ineligible for promotion to the next higher post until he/she passes the said examination."}</p></div>}
      {(flags.N||flags.D||flags.L)&&R.probation&&<div><p className="font-bold">{R.probation}. Probation Period.—</p>{d.probationVariant==="standard"&&<p className="mt-1">A person appointed by nomination to the post mentioned in Rule 3 shall be on probation for a period of <span className="font-semibold">{d.probationYears} years</span>. The probation period may be extended by a maximum of <span className="font-semibold">{d.probationExtension} year</span> at the discretion of the Appointing Authority. Completion of this probation period (including extended period) satisfactorily as per the probation policy of the Government{d.hasDeptExam&&d.deptExamPurpose==="confirmation"?`, and passing of the prescribed Departmental Examination (${d.deptExamName||"[EXAM]"}), if any,`:""} are mandatory. In the event of failing to complete the probation period (including extended period) satisfactorily as per the probation policy of the Government, his/her services shall be liable to be terminated.</p>}{d.probationVariant==="cptp"&&<p className="mt-1">The Officers who are appointed to the post mentioned in Rule 3 and are undergoing training under the Combined Probationary Training Programme (CPTP), the service matters pertaining to their probation, seniority, departmental examination and other related service matters shall be regulated by the provisions made in the various Government Resolutions, Government Circulars, Rules and Notifications issued by the CPTP Desk of the General Administration Department from time to time. In the event of finding the person so appointed unsuitable for the said post, his/her services shall be liable to be terminated.</p>}{d.probationVariant==="group_bc"&&<p className="mt-1">{d.additionalProbationText||"[Incorporate probation provisions as per the Administrative Department's order for this post — period, mandatory conditions, and consequences of non-compliance.]"}</p>}</div>}
      {d.languageExam&&R.language&&<div><p className="font-bold">{R.language}. Provision regarding Hindi and Marathi Language Examination.—</p>{flags.P===1&&<p className="mt-1">(a) A Government Servant appointed by promotion to the post mentioned in Rule 3 shall either have passed the Hindi and Marathi language examinations, as regulated by the Marathi Language Department from time to time, or have been exempted from passing them, before promotion to the said post. In the absence of such qualification or exemption, promotion to the post shall not be admissible.</p>}{flags.N===1&&<p className="mt-1">{flags.P===1?"(b)":"(a)"} A Government Servant appointed by nomination to the post mentioned in Rule 3, who has not passed the Hindi and Marathi language examinations before appointment, shall be required to pass them within the prescribed time limit after appointment. Failure to do so shall result in withholding of annual increments, and promotion to any higher post shall not be admissible until such examinations are passed.</p>}</div>}
      {d.computerCert&&R.computer&&<div><p className="font-bold">{R.computer}. Provision regarding Certificate of Computer Operations.—</p>{flags.P===1&&<p className="mt-1">(a) A Government Servant appointed by promotion to the post mentioned in Rule 3 shall either possess a Certificate of Computer Operations as regulated by the Government (General Administration Department / Information Technology) from time to time, or have obtained exemption on grounds of age, before promotion. In the absence of such certificate or exemption, promotion shall not be admissible.</p>}{flags.N===1&&!d.isCPTP&&<p className="mt-1">{flags.P===1?"(b)":"(a)"} A Government Servant appointed by nomination who does not possess a Certificate of Computer Operations before appointment shall be required to obtain such certificate within the prescribed time limit. Failure to do so shall result in withholding of annual increments, and promotion shall not be admissible until such certificate is obtained.</p>}{flags.N===1&&d.isCPTP&&<p className="mt-1">{flags.P===1?"(b)":"(a)"} A Government Servant appointed by nomination to the post mentioned in Rule 3 and undergoing training under the Combined Probationary Training Programme (CPTP), who clears the Post-Graduate Course under CPTP as provided vide GAD (Information Technology) Government Resolution dated 30.07.2019, shall be treated as having passed the Computer Eligibility Examination. Future orders issued in this behalf shall also be applicable.</p>}</div>}
      {d.smallFamily&&R.smallFamily&&<div><p className="font-bold">{R.smallFamily}. Provision regarding Small Family Affidavit.—</p><p className="mt-1">(1) A person appointed to the posts under Rule 3 by nomination shall be required to submit a small family affidavit at the time of appointment as per the provisions of the Maharashtra Civil Services (Affidavit of Small Families) Rules, 2005 and the rules made thereunder from time to time.</p><p className="mt-1">(2) If it is found that the number of children in the small family affidavit is more than two, the candidate concerned shall be ineligible for government appointment.</p><p className="mt-1">(3) After a person is appointed to the Government service, if it is proved that he has more than two children at the time of appointment or thereafter, that person shall be disqualified for Government service.</p></div>}
      {R.transfer&&<div><p className="font-bold">{R.transfer}. Provision regarding Transfer.—</p><p className="mt-1">The seniority list of persons appointed to the post mentioned in Rule 3 shall be maintained at <span className="font-semibold">{tlevel.label}</span>. Accordingly, such persons shall be eligible for transfer {tlevel.text}.</p>{d.separateSeniorityForPromotion&&<p className="mt-1">Provided that, for the purpose of promotion to the next higher post, the seniority lists maintained at {tlevel.label} shall be consolidated into a State-level seniority list on the basis of date of appointment.</p>}</div>}
      {d.hasCompassionate&&<p><span className="font-bold">[Additional Rule].</span> Compassionate Appointment.— The provisions regarding appointment on compassionate grounds, as per the policy of the Government from time to time, shall be applicable to the post mentioned in Rule 3.</p>}
      {d.otherRules&&R.otherRules&&<p><span className="font-bold">{R.otherRules}. Applicability of Other Orders/Rules regarding Services after Entry into Government Service.—</span> After being appointed to the Government service, the terms and conditions fixed by the Government order on behalf of the State Government shall remain applicable to the person concerned.</p>}
      {d.additionalProvisions&&R.additional&&<div><p className="font-bold">{R.additional}. Additional Provisions.—</p><p className="mt-1 whitespace-pre-wrap">{d.additionalProvisions}</p></div>}
      <div className="mt-8 text-right">
        <p>By order and in the name of the Governor of Maharashtra,</p>
        <div className="mt-6">
          <p className="font-bold">{d.signatoryName||"[SIGNATORY NAME]"},</p>
          <p>{d.signatoryDesignation||"[DESIGNATION]"},</p>
          <p>{d.deptName||"[DEPARTMENT NAME]"}.</p>
        </div>
      </div>
    </div>
  </div>);
}

const STEPS=["Department & Post","Post Details","Definitions","Mode of Appointment","Departmental Examination","Probation & Language","Other Provisions & Signatory","Preview & Export"];
function App(){
  const [step,setStep]=useState(0);
  const [data,setData]=useState(defaultData);
  const [copied,setCopied]=useState(false);
  const set=(k,v)=>setData(p=>({...p,[k]:v}));
  const handleCopy=()=>{const el=document.getElementById("preview-content");if(el){navigator.clipboard.writeText(el.innerText).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});}};
  const handlePrint=()=>{const el=document.getElementById("preview-content");if(!el)return;const w=window.open("","_blank");w.document.write(`<html><head><title>Recruitment Rule</title><style>body{font-family:Georgia,serif;font-size:13px;line-height:1.8;margin:40px 60px;color:#111}.font-bold,.font-semibold{font-weight:700}.italic{font-style:italic}.text-center{text-align:center}.text-right{text-align:right}.uppercase{text-transform:uppercase}.tracking-wide{letter-spacing:0.05em}.ml-4{margin-left:1.5rem}.ml-8{margin-left:3rem}.mt-1{margin-top:0.3rem}.mt-2{margin-top:0.5rem}.mt-6{margin-top:1.5rem}.mt-8{margin-top:2rem}.space-y-4>*+*,.space-y-3>*+*{margin-top:0.5rem}.text-xs{font-size:0.75rem}.text-lg{font-size:1.1rem}</style></head><body>${el.innerHTML}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),500);};
  const steps=[<Step1 d={data} set={set}/>,<Step2 d={data} set={set}/>,<Step3 d={data} set={set}/>,<Step4 d={data} set={set}/>,<Step5 d={data} set={set}/>,<Step6 d={data} set={set}/>,<Step7 d={data} set={set}/>,<div id="preview-content"><Preview d={data}/></div>];
  return(<div className="min-h-screen bg-gray-50">
    <div className="bg-white border-b border-gray-200 px-4 overflow-x-auto flex items-center justify-between gap-3 sticky top-0 z-10"><div className="flex gap-1 min-w-max py-2">{STEPS.map((s,i)=>(<button key={i} onClick={()=>setStep(i)} className={`px-3 py-1.5 rounded-md text-xs font-medium transition whitespace-nowrap ${i===step?"bg-blue-600 text-white":"text-gray-500 hover:bg-gray-100"}`}>{i===STEPS.length-1?"":""}{s}</button>))}</div><div className="text-xs text-gray-400 whitespace-nowrap pr-2">Step {step+1} of {STEPS.length}</div></div>
    <div className="h-1 bg-gray-200"><div className="h-1 bg-blue-500 transition-all" style={{width:`${((step+1)/STEPS.length)*100}%`}}/></div>
    <div className="max-w-3xl mx-auto px-4 py-6">
      <div className="mb-4 flex items-center justify-between">
        <h2 className="text-xl font-bold text-gray-800">{STEPS[step]}</h2>
        {step===STEPS.length-1&&(<div className="flex gap-2"><button onClick={handleCopy} className={`text-sm px-4 py-2 rounded-lg font-medium transition ${copied?"bg-green-500 text-white":"bg-blue-600 text-white hover:bg-blue-700"}`}>{copied?"Copied!":"Copy Text"}</button><button onClick={handlePrint} className="text-sm px-4 py-2 rounded-lg font-medium bg-gray-700 text-white hover:bg-gray-800 transition">Print / Save PDF</button></div>)}
      </div>
      {steps[step]}
      <div className="flex justify-between mt-6">
        <button onClick={()=>setStep(s=>Math.max(0,s-1))} disabled={step===0} className="px-5 py-2 rounded-lg border border-gray-300 text-sm font-medium text-gray-600 disabled:opacity-30 hover:bg-gray-50 transition">← Previous</button>
        {step<STEPS.length-1?<button onClick={()=>setStep(s=>s+1)} className="px-5 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-700 transition">Next →</button>:<button onClick={()=>setStep(0)} className="px-5 py-2 rounded-lg bg-gray-700 text-white text-sm font-medium hover:bg-gray-800 transition">Edit Again</button>}
      </div>
    </div>
  </div>);
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
